[package]
name = "rustyfiles"
version = "2.1.5"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.83"
aws-config = { version = "1.5.10", features = ["behavior-version-latest"] }
aws-credential-types = "1.2.1"
aws-sdk-s3 = { version = "1.65.0", features = ["rt-tokio"] }
axum = { version = "0.7.9", features = ["multipart"] }
bytes = "1.9.0"
dotenv = "0.15.0"
env_logger = "0.11.8"
http-body-util = "0.1.3"
image = { version = "0.25.6", features = ["webp"] }
log = "0.4.27"
mime_guess = "2.0.5"
ravif = { version = "0.11.12", default-features = false }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "gzip", "rustls-tls", "http2"] }
rgb = "0.8.37"
tempfile = "3.20.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
urlencoding = "2.1.3"
webp = "0.3.0"
